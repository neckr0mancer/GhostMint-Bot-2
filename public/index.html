<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GhostMint Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1020; color: #f8fafc; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #24304f 0, #0b1020 48rem); }
    main { width: min(42rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid rgba(148, 163, 184, .25); border-radius: 1.5rem; background: rgba(15, 23, 42, .82); box-shadow: 0 1.5rem 5rem rgba(0, 0, 0, .35); }
    h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 6vw, 4rem); }
    p { color: #cbd5e1; line-height: 1.6; }
    code { color: #93c5fd; }
    .status { display: inline-flex; align-items: center; gap: .5rem; margin-top: 1rem; padding: .75rem 1rem; border-radius: 999px; background: rgba(34, 197, 94, .14); color: #bbf7d0; }
    .dot { width: .65rem; height: .65rem; border-radius: 999px; background: #22c55e; box-shadow: 0 0 1rem #22c55e; }
  </style>
</head>
<body>
  <main>
    <h1>👻 GhostMint</h1>
    <p>The GhostMint server is running. Use the protected API endpoints and Telegram bot commands to manage wallets, scheduled mints, and activity.</p>
    <p>Health checks are available at <code>/health</code>.</p>
    <div class="status"><span class="dot"></span><span>Dashboard shell online</span></div>
  </main>
</body>
</html>
